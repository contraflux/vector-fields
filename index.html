<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Vector Fields</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="js/app.js" defer></script>
</head>

<body>
    <div class="header">
        <a href="https://echotops.github.io/software">← Back to Software</a>
        <div class="header-button" id="walkthrough-button">
            Tutorial
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5a4.5 4.5 0 0 0-2.5 8.24c.4.28.6.72.6 1.18v.08h4v-.08c0-.46.2-.9.6-1.18A4.5 4.5 0 0 0 8 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.5 13h3M7 14.5h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
    </div>
    <div class="equation-container">
        <div class="container-row">
            <h3>dx/dt</h3>
            <input type="text" id="x-dot" value="y">
        </div>
        <div class="container-row">
            <h3>dy/dt</h3>
            <input type="text" id="y-dot" value="-x">
        </div>
    </div>

    <div class="color-container">
        <div class="container-row">
            <h3>Start Color</h3>
            <input type="color" id="start-color" value="#000000">
        </div>
        <div class="container-row">
            <h3>End Color</h3>
            <input type="color" id="end-color" value="#ffffff">
        </div>
    </div>

    <div class="input-container">
        <div class="container-row" id="top-container">
            <h3>Normalize</h3>
            <input type="checkbox" id="normalize-tick" value="True">
        </div>
        <div class="container-row">
            <h3>Overlay</h3>
            <select name="Overlay" id="overlay">
                <option value="none">None</option>
                <option value="div">Divergence</option>
                <option value="curl">Curl</option>
            </select>
        </div>
        <div class="container-row">
            <h3>Arrow Scale</h3>
            <input type="range" id="arrow-scale" min="1e-3" max="1" value="5e-2" step="1e-4">
        </div>
        <div class="container-row">
            <h3>Arrow Density</h3>
            <input type="range" id="arrow-density" min="1" max="5" value="2">
        </div>
        <div class="scroll-hint">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
    </div>

    <div class="canvas-container">
        <canvas class="canvas" id="canvas"></canvas>
    </div>

    <div class="walkthrough-box" id="walkthrough-box">
        <span class="walkthrough-close" id="walkthrough-close">&times;</span>
        <h3 id="walkthrough-title">Title</h3>
        <p id="walkthrough-text">Text</p>
        <div class="walkthrough-bottom">
            <div class="input-box-button" id="walkthrough-back">
                <p>Back</p>
            </div>
            <span id="walkthrough-progress">1 / 4</span>
            <div class="input-box-button" id="walkthrough-next">
                <p>Next</p>
            </div>
        </div>
    </div>
</body>

</html>
